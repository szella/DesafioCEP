spring.application.name=DesafioCEP

# Configuracoes de logs e monitoramento
logging.level.root=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [CID: %X{correlationId}] %logger{36} - %msg%n

#Configuracao do DB
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/desafio_cep}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

#Configuracao do kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=true
spring.kafka.producer.properties.spring.json.type.mapping=endereco:br.com.szella.desafiocep.domain.input.EnderecoInput,log-consulta:br.com.szella.desafiocep.domain.dto.LogConsultaDto

spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:desafio-cep}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=br.com.szella.desafiocep.domain.dto,br.com.szella.desafiocep.domain.input
spring.kafka.consumer.properties.spring.json.use.type.headers=true
spring.kafka.consumer.properties.spring.json.type.mapping=endereco:br.com.szella.desafiocep.domain.input.EnderecoInput,log-consulta:br.com.szella.desafiocep.domain.dto.LogConsultaDto
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.retries=2147483647
spring.kafka.producer.properties.delivery.timeout.ms=120000
spring.kafka.producer.properties.request.timeout.ms=30000
spring.kafka.listener.ack-mode=record

# Kafka topic names
kafka.topic.endereco=${KAFKA_TOPIC_ENDERECO:topico-endereco}
kafka.topic.log-consulta=${KAFKA_TOPIC_LOG_CONSULTA:topico-log-consulta}
kafka.topic.endereco-dlt=${KAFKA_TOPIC_ENDERECO_DLT:topico-endereco.DLT}
kafka.topic.log-consulta-dlt=${KAFKA_TOPIC_LOG_CONSULTA_DLT:topico-log-consulta.DLT}
kafka.topic.partitions=1
kafka.topic.replication-factor=1
kafka.dlt.send-result-timeout=15s
kafka.consumer.retry-interval=1s
kafka.consumer.retry-attempts=3

# External HTTP client timeouts
api.http.connect-timeout=2s
api.http.read-timeout=5s

#APIs externas
api.url.busca.cep=https://viacep.com.br/ws/{CEP}/json
api.url.busca.logradouro=https://viacep.com.br/ws/{UF}/{CIDADE}/{LOGRADOURO}/json

# Audit log retention
log.consultas.retention-days=90
log.consultas.retention-cron=0 0 3 * * *